<form method="get" class="filtro">
  <label class="field">
    <span>Desde</span>
    <input type="date" name="desde" value="{{ desde|date:'Y-m-d' }}">
  </label>
  <label class="field">
    <span>Hasta</span>
    <input type="date" name="hasta" value="{{ hasta|date:'Y-m-d' }}">
  </label>
  {% if codigo %}
  <label class="field">
    <span>Cuenta</span>
    <input type="text" name="cuenta" value="{{ codigo }}" maxlength="6">
  </label>
  {% endif %}
  <button class="btn btn-ghost" type="submit">Aplicar</button>
</form>
