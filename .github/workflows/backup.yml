name: Respaldo diario

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - name: Volcar la base
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p out
          docker run --rm -v "$PWD/out:/out" postgres:17.11 \
            pg_dump "$DATABASE_URL" -Fc -f /out/tilmux.dump

      - name: Guardar el respaldo
        uses: actions/upload-artifact@v7
        with:
          name: tilmux-${{ github.run_number }}
          path: out/tilmux.dump
          retention-days: 30
