name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: solo-para-integracion-continua
      DJANGO_DB_SSLMODE: disable
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Instalar dependencias
        run: uv sync

      - name: Ejecutar los invariantes
        run: uv run python manage.py test tests -v 2
