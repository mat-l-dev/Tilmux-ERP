name: Verificar restauración

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  restaurar:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restaurado
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Instalar dependencias
        run: uv sync

      - name: Crear copia y huellas de la misma instantánea
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/verificar_respaldo.py crear

      - name: Restaurar en una base vacía
        run: |
          # El volcado incluye CREATE SCHEMA public; se elimina antes para que no choque.
          docker run --rm --network host -e PGPASSWORD=postgres postgres:17 \
            psql -h 127.0.0.1 -U postgres -d restaurado -v ON_ERROR_STOP=1 \
              -c "DROP SCHEMA IF EXISTS public CASCADE;"

          docker run --rm --network host \
            -v "$PWD/out:/in" -e PGPASSWORD=postgres postgres:17 \
            pg_restore -h 127.0.0.1 -U postgres -d restaurado \
              -O -x --exit-on-error /in/tilmux.dump

      - name: Comparar la copia restaurada con la instantánea original
        env:
          RESTORE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/restaurado
        run: uv run python scripts/verificar_respaldo.py verificar
