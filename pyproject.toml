[project]
name = "tilmux-erp"
version = "0.1.0"
description = "ERP contable de TILMUX S.A.C."
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<6.2",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.8",
    "gunicorn>=23",
    "openpyxl>=3.1",
    "waitress>=3.0",
    "defusedxml>=0.7",
    "reportlab>=5.1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
